version: '3.8'

services:
  backend:
    build:
      context: .
    container_name: eventos-backend
    ports:
      - "8100:80"
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      eventos_net:
        ipv4_address: 192.168.251.10
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: >
      sh -c "sleep 10 &&
             php artisan migrate --force &&
             apache2-foreground"

  postgres:
    image: postgres:15-alpine
    container_name: eventos-postgres
    environment:
      POSTGRES_DB: eventos_unibague
      POSTGRES_USER: desarrollador
      POSTGRES_PASSWORD: Ed?3p20DB23
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      eventos_net:
        ipv4_address: 192.168.251.12

networks:
  eventos_net:
    external: true

volumes:
  pgdata:
