version: '3.8'

services:
  backend:
    container_name: eventos-backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8100:443"        # Mapea el HTTPS interno (443) al 8100 del host
      - "8000:80"         # Opcional: si quieres exponer HTTP directo para pruebas
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      eventos_net:
        ipv4_address: 192.168.251.10
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: >
      sh -c "sleep 10 &&
             php artisan migrate --force &&
             apache2-foreground"
    volumes:
      - ./apache/002-eventos.conf:/etc/apache2/sites-available/002-eventos.conf:ro
      - .:/var/www/html:delegated           # Monta tu código (incluye vendor en build)
      - /etc/ssl/unibague:/etc/ssl/unibague:ro

  postgres:
    image: postgres:15-alpine
    container_name: eventos-postgres
    environment:
      POSTGRES_DB: eventos_unibague
      POSTGRES_USER: desarrollador
      POSTGRES_PASSWORD: 'Ed?3p20DB23'
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      eventos_net:
        ipv4_address: 192.168.251.12

networks:
  eventos_net:
    external: true

volumes:
  pgdata:
